version: 1.0.{build}

image: Visual Studio 2022

branches:
  only:
    - staging
    - main

clone_depth: 1

environment:
  nodejs_version: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

install:
  - ps: Install-Product node $env:nodejs_version
  - ps: Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "dotnet-install.ps1"
  - ps: .\dotnet-install.ps1 -Channel 10.0 -InstallDir "C:\Program Files\dotnet"

dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'
  package_version: '{version}'
  assembly_version: '{version}'
  file_version: '{version}'
  informational_version: '{version}'

before_build:
  - dotnet --version
  - node --version
  - ps: |
      $pgService = Get-Service -Name "postgresql-x64-14" -ErrorAction SilentlyContinue
      if ($pgService -eq $null) {
        $pgService = Get-Service | Where-Object { $_.Name -like "postgresql*" } | Select-Object -First 1
      }
      if ($pgService -ne $null) {
        Write-Host "Starting PostgreSQL service: $($pgService.Name)"
        Start-Service $pgService.Name
        Start-Sleep -Seconds 5
      } else {
        Write-Error "No PostgreSQL service found!"
        exit 1
      }
  - ps: |
      $env:PGPASSWORD = "Password12!"
      & "C:\Program Files\PostgreSQL\14\bin\createdb.exe" -U postgres garneau_template_tests
      if ($LASTEXITCODE -ne 0) { Write-Host "DB may already exist, continuing..." }
  - cd %APPVEYOR_BUILD_FOLDER%\tests\Tests.Common
  - mv -f appsettings.appveyor.json appsettings.json
  - cd %APPVEYOR_BUILD_FOLDER%

build_script:
  - dotnet build

test_script:
  - ps: |
      if ($env:APPVEYOR_REPO_BRANCH -eq "staging" -or $env:APPVEYOR_REPO_BRANCH -eq "main") {
        dotnet test --no-build .\tests\Tests.Infrastructure
        dotnet test --no-build .\tests\Tests.Application
        dotnet test --no-build .\tests\Tests.Domain\
        dotnet test --no-build .\tests\Tests.Web\
      }

deploy_script:
  - ps: |
      if ($env:APPVEYOR_REPO_BRANCH -eq "main") {
        Write-Host "Tests passed. Triggering Render deployment..."
        Invoke-WebRequest -Uri $env:RENDER_DEPLOY_HOOK_URL -Method POST -TimeoutSec 30
        Write-Host "Render deployment triggered!"
      }
